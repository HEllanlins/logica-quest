}
function exam(l){
  if(!confirm('Prova de nivelamento do nível '+LV[l][0]+': 3 desafios, sem dicas. Errou um, a prova acaba. Topa?'))return;
  const ids=lvQ(l).filter(q=>'ob'.includes(q.t)).sort(()=>Math.random()-.5).slice(0,3).map(q=>q.id);EX={l,ids,i:0};play(ids[0]);
}
const nextEx=()=>{EX.i++;if(EX.i<3){toast('✅ Acertou! Próximo desafio...');setTimeout(()=>play(EX.ids[EX.i]),800)}else{DONE._u=Math.max(DONE._u||0,EX.l);save();toast('🔓 Nível '+LV[EX.l][0]+' liberado!');EX=null;home()}};
const failEx=()=>{toast('❌ Prova reprovada. Estude a trilha e tente de novo.');EX=null;home()};
const TIP={o:"Simule o código linha a linha, anotando o valor de cada variável.",b:"Procure erro de digitação, de limite (< ou <=) ou de lógica, uma linha por vez.",r:"Comece pelo que prepara os dados (declarações); o que depende deles vem depois."};
function play(id){
  const q=Q.find(x=>x.id==id),ty=q.t=='m'?'r':q.t;P={h:0};
  $app.innerHTML=head()+`<div class="top"><button class="b3d sm" id="bk">← Voltar</button>${EX?`<span class="tag">Prova ${EX.i+1}/3</span>`:''}</div>
  <section class="glass card up"><b>${K[q.t]}</b> <span class="tag">${esc(q.g)}</span>
  <p>${ty=='o'?'O que este código imprime?':ty=='b'?'Clique na linha com o erro.':(q.t=='m'?'Monte o minigame: ':'')+'coloque as linhas na ordem certa. Clique numa linha colocada para tirá-la.'}</p>
  <div id="box"></div><div class="row">${EX?'':'<button class="b3d sm" id="hn">💡 Pedir dica</button>'}</div><div id="fb"></div></section>`;
  $('#bk').onclick=()=>{EX=null;level(q.l)};
  const box=$('#box'),fb=t=>{$('#fb').innerHTML=t};
  const bad=()=>EX?setTimeout(failEx,700):fb('<div class="msg">❌ Quase! Releia e tente de novo — você não precisa recomeçar.</div>');
  const win=()=>{
    $$('#box button').forEach(b=>b.disabled=true);$$('#box .ln').forEach(l=>l.style.pointerEvents='none');
    if(EX)return nextEx();
    const was=have(),wu=unl(),first=!DONE[q.id];DONE[q.id]=1;save();
    have().filter(n=>!was.includes(n)).forEach(n=>toast('🏆 Conquista: '+n));if(unl()>wu)toast('🔓 Novo nível liberado!');
    const nx=Q[Q.indexOf(q)+1],nn=nx&&nx.l==q.l?nx:null;
    fb(`<div class="msg">✅ Correto! ${first?'<b class="pop">+10 XP</b>':''}<br>${esc(q.e)}<div class="row">${nn?'<button class="b3d pri" id="nx">Próximo →</button>':''}<button class="b3d" id="lb">Voltar ao nível</button></div></div>`);
    $('#lb').onclick=()=>level(q.l);if(nn)$('#nx').onclick=()=>play(nn.id);
  };
  let got=[];const pool=q.c.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  const draw=()=>{
    const full=got.length==pool.length,ok=full&&got.every((g,k)=>g.i==k);
    box.innerHTML=`<pre>${got.length?got.map((g,k)=>`<span class="ln pl ${full&&!ok&&g.i!=k?'no':''}" data-k="${k}">${esc(g.t)}</span>`).join(''):'<span class="mu">(clique nas linhas abaixo)</span>'}</pre><div class="row">${pool.filter(p=>!got.includes(p)).map(p=>`<button class="b3d chip" data-i="${p.i}">${esc(p.t)}</button>`).join('')}</div>`;
    $$('.chip').forEach(b=>b.onclick=()=>{got.push(pool.find(p=>p.i==b.dataset.i));draw()});
    $$('.pl').forEach(l=>l.onclick=()=>{got.splice(+l.dataset.k,1);draw()});
    if(ok)win();else if(full)bad();
  };
  if(ty=='o'){
    box.innerHTML=code(q.c)+`<div class="opts">${q.o.map((o,i)=>`<button class="b3d" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    $$('.opts button').forEach(b=>b.onclick=()=>{if(+b.dataset.i==q.a){b.classList.add('ok');win()}else{b.disabled=true;b.classList.add('no');bad()}});
  }else if(ty=='b'){
    box.innerHTML=code(q.c,'pick');
    $$('.ln').forEach(l=>l.onclick=()=>{if(+l.dataset.i==q.a){l.classList.add('ok');win()}else{l.classList.add('no');bad()}});
  }else draw();
  if(!EX)$('#hn').onclick=()=>{
    P.h++;
    if(P.h==1)fb(`<div class="msg">💡 Dica 1: ${TIP[ty]}</div>`);
    else if(P.h==2){
      if(ty=='o')$$('.opts button').filter(b=>+b.dataset.i!=q.a&&!b.disabled).slice(0,2).forEach(b=>{b.disabled=true;b.classList.add('dim')});
      else if(ty=='b'){$$('.ln')[q.a].classList.add('cand');$$('.ln')[(q.a+1)%q.c.length].classList.add('cand')}
      else{const n=got.findIndex((g,k)=>g.i!=k),keep=n<0?got.length:n;got.length=keep;if(keep<pool.length)got.push(pool.find(p=>p.i==keep));draw()}
      fb(`<div class="msg">💡 Dica 2: ${ty=='o'?'tirei duas opções erradas.':ty=='b'?'o erro está numa das linhas destacadas.':'coloquei a próxima linha certa para você.'}</div>`);
    }else fb(`<div class="msg">💡 Dica 3: ${esc(q.e)}</div>`);
  };
}
$app.innerHTML='<p>Carregando…</p>';
sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(async()=>{
  if(!ses){USER=null;DONE={};login();return}
  if(USER===ses.user.id)return;
  USER=ses.user.id;NAME=ses.user.user_metadata?.full_name||ses.user.email||'';
  const{data}=await sb.from('progress').select('done').eq('user_id',USER).maybeSingle();
  DONE=(data&&data.done)||{};home();
},0)});
</script></body></html>
